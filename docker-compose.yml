services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      UTL_API_URL: ${UTL_API_URL:-https://token-list-api.solana.cloud}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - token_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  alert-worker:
    build: .
    command: ["node", "src/alert-worker.js"]
    restart: unless-stopped
    environment:
      PORT: 3000
      ALERT_POLL_INTERVAL_MS: ${ALERT_POLL_INTERVAL_MS:-60000}
      ALERT_DEFAULT_COOLDOWN_MS: ${ALERT_DEFAULT_COOLDOWN_MS:-1800000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_DRY_RUN: ${ALERT_DRY_RUN:-false}
    volumes:
      - token_data:/app/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  token_data:
